.sub{color:var(--mu);margin:4px 0 14px;max-width:46em}

button[aria-pressed=true],button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.sl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 22px}
.sl label{display:block;font-size:12px;color:var(--mu)}.sl b{color:var(--ink);float:right;font-weight:600}
input[type=range]{width:100%;accent-color:var(--ac)}

.k b{display:block;font-size:20px;font-weight:600}.k span{font-size:12px;color:var(--mu)}.k i{font-style:normal;font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}

.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}

th{color:var(--mu);font-weight:500}th button{border:0;background:none;padding:0;color:inherit;font-weight:inherit}

.r{display:grid;grid-template-columns:90px 1fr 60px;gap:8px;align-items:center;font-size:13px;margin:7px 0}

.note{font-size:12px;color:var(--mu);margin-top:10px}
